<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Website blocked</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        align-items: center;
        background: radial-gradient(circle at 80% 10%, #17202e 0, #07090d 52%);
        color: #f4f2ee;
        display: flex;
        font: 16px/1.5 system-ui, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 32px;
      }
      main {
        background: #141820;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-left: 4px solid #ff5843;
        border-radius: 14px;
        max-width: 620px;
        padding: 34px;
        width: 100%;
      }
      p { color: #b9c0cc; margin-bottom: 0; }
      .eyebrow {
        color: #ff7963;
        font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 { font: 750 32px/1.1 ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Parental Control</div>
      <h1>This website is blocked.</h1>
      <p>A parent-managed rule is active for this browser profile. Ask your parent to change the website policy if you need access.</p>
    </main>
  </body>
</html>
