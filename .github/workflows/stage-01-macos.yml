name: Stage 01 macOS

on:
  pull_request:
    paths:
      - ".github/workflows/stage-01-macos.yml"
      - ".gitignore"
      - ".codex/environments/environment.toml"
      - "README.md"
      - "apps/controller-macos/**"
      - "docs/stages/**"
      - "packages/design-assets/**"
      - "script/**"
      - "test/**"
      - "tools/**"
  push:
    branches:
      - "stage/01-controller-shell"
    paths:
      - ".github/workflows/stage-01-macos.yml"
      - ".gitignore"
      - ".codex/environments/environment.toml"
      - "README.md"
      - "apps/controller-macos/**"
      - "docs/stages/**"
      - "packages/design-assets/**"
      - "script/**"
      - "test/**"
      - "tools/**"

permissions:
  contents: read

concurrency:
  group: stage-01-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      SWIFT_WORKERS: "2"
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.artifacts/derived-data/stage-01/module-cache
      SWIFT_MODULE_CACHE_PATH: ${{ github.workspace }}/.artifacts/derived-data/stage-01/module-cache
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Run repository tests
        run: npm test

      - name: Lint Swift sources
        run: swift format lint --recursive apps/controller-macos/Sources apps/controller-macos/Tests

      - name: Run controller tests
        run: |
          swift test \
            --disable-sandbox \
            --package-path apps/controller-macos \
            --cache-path "$PWD/.artifacts/derived-data/stage-01/swiftpm-cache" \
            --config-path "$PWD/.artifacts/derived-data/stage-01/swiftpm-config" \
            --security-path "$PWD/.artifacts/derived-data/stage-01/swiftpm-security" \
            --scratch-path "$PWD/.artifacts/derived-data/stage-01/swiftpm" \
            --jobs "$SWIFT_WORKERS"

      - name: Build and package release candidate
        run: ./script/package_release.sh

      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ParentalControlController-0.1.0-rc.1-arm64
          path: |
            .artifacts/release-candidate/ParentalControlController-0.1.0-rc.1-arm64.dmg
            .artifacts/release-candidate/ParentalControlController-0.1.0-rc.1-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Clean project-owned generated output
        if: always()
        run: ./tools/cleanup.sh --apply
