name: Stage 05 Chromium and macOS integration

on:
  pull_request:
    paths:
      - ".github/workflows/stage-03-macos.yml"
      - ".gitignore"
      - ".codex/environments/environment.toml"
      - "agents/endpoint-macos/**"
      - "apps/controller-macos/**"
      - "browser-extensions/**"
      - "packages/design-assets/**"
      - "script/**"
      - "test/**"
      - "tools/**"
permissions:
  contents: read

concurrency:
  group: stage-06-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SWIFT_WORKERS: "2"
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.artifacts/derived-data/stage-06/module-cache
      SWIFT_MODULE_CACHE_PATH: ${{ github.workspace }}/.artifacts/derived-data/stage-06/module-cache
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Detect installer-affecting changes
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE_SHA="$BEFORE_SHA"
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$PR_BASE_SHA"
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --quiet "$BASE_SHA" HEAD -- \
            .github/workflows/stage-03-macos.yml \
            .gitignore \
            .codex/environments/environment.toml \
            agents/endpoint-macos \
            apps/controller-macos \
            browser-extensions \
            packages/design-assets \
            script \
            test \
            tools; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js
        if: steps.scope.outputs.build == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Run repository checks
        if: steps.scope.outputs.build == 'true'
        run: npm test
      - name: Lint endpoint sources
        if: steps.scope.outputs.build == 'true'
        run: swift format lint --recursive agents/endpoint-macos/Sources agents/endpoint-macos/Tests
      - name: Lint controller sources
        if: steps.scope.outputs.build == 'true'
        run: swift format lint --recursive apps/controller-macos/Sources apps/controller-macos/Tests
      - name: Test controller and hub
        if: steps.scope.outputs.build == 'true'
        run: swift test --disable-sandbox --package-path apps/controller-macos --scratch-path "$PWD/.artifacts/derived-data/stage-06/controller-tests" --jobs "$SWIFT_WORKERS"
      - name: Test endpoint core
        if: steps.scope.outputs.build == 'true'
        run: swift test --disable-sandbox --package-path agents/endpoint-macos --scratch-path "$PWD/.artifacts/derived-data/stage-06/endpoint-tests" --jobs "$SWIFT_WORKERS"
      - name: Build selectable system installer
        if: steps.scope.outputs.build == 'true'
        run: ./script/package_endpoint_release.sh
      - name: Verify universal slices
        if: steps.scope.outputs.build == 'true'
        run: |
          for binary in "dist/Parental Control Child.app/Contents/MacOS/ParentalControlChild" "dist/Parental Control Child.app/Contents/Helpers/ParentalControlAgentDaemon" "dist/Parental Control Child.app/Contents/Helpers/ParentalControlAgentUser" "dist/Parental Control Child.app/Contents/Helpers/ParentalControlBrowserHost"; do
            /usr/bin/lipo -archs "$binary" | grep -q arm64
            /usr/bin/lipo -archs "$binary" | grep -q x86_64
          done
      - name: Verify selectable package choices
        if: steps.scope.outputs.build == 'true'
        run: |
          /usr/sbin/installer -showChoicesXML -pkg ".artifacts/release-candidate/ParentalControlSystem-0.6.0-rc.2.pkg" -target / | /usr/bin/plutil -lint -
          /usr/sbin/pkgutil --check-signature ".artifacts/release-candidate/ParentalControlSystem-0.6.0-rc.2.pkg" || true
          /usr/bin/unzip -t ".artifacts/release-candidate/ParentalControlBrowserSharing-0.6.0-rc.2.zip"
      - name: Install default parent choice
        if: steps.scope.outputs.build == 'true'
        run: |
          sudo /usr/sbin/installer \
            -pkg ".artifacts/release-candidate/ParentalControlSystem-0.6.0-rc.2.pkg" \
            -target /
          test -x "/Applications/Parental Control.app/Contents/MacOS/ParentalControlController"
          test ! -e "/Applications/Parental Control Child.app"
          /usr/bin/codesign --verify --deep --strict "/Applications/Parental Control.app"
          sudo /bin/rm -rf -- "/Applications/Parental Control.app"
          sudo /usr/sbin/pkgutil --forget com.bilalalissa.ParentalControlController.component >/dev/null
      - name: Install, diagnose, and uninstall child choice
        if: steps.scope.outputs.build == 'true'
        run: |
          sudo /usr/sbin/installer \
            -applyChoiceChangesXML agents/endpoint-macos/Installer/ci-child-choices.xml \
            -pkg ".artifacts/release-candidate/ParentalControlSystem-0.6.0-rc.2.pkg" \
            -target /
          console_user="$(/usr/bin/stat -f '%Su' /dev/console)"
          console_user_home="$(/usr/bin/dscl . -read "/Users/$console_user" NFSHomeDirectory | /usr/bin/awk '{print $2}')"
          status_ok=false
          for attempt in 1 2 3; do
            if /usr/local/bin/parental-control-agentctl status > .artifacts/endpoint-status.json; then
              status_ok=true
              break
            fi
            if [[ "$attempt" != 3 ]]; then sleep 2; fi
          done
          status_exit=0
          if [[ "$status_ok" == true ]]; then
            node -e 'const fs = require("node:fs"); const status = JSON.parse(fs.readFileSync(".artifacts/endpoint-status.json", "utf8")); if (status.daemonHealthy !== true || status.connectionState !== "unpaired" || !status.deviceID || status.activityCollectionEnabled !== true || status.activityRetentionDays !== 7 || status.browserCollectionEnabled !== false || status.browserRetentionDays !== 7 || status.browserTabs.length !== 0) process.exit(1)'
            /bin/launchctl print system/com.bilalalissa.ParentalControlAgent.daemon >/dev/null
            helper_ok=false
            for attempt in 1 2 3; do
              if /usr/bin/pgrep -f "/Applications/Parental Control Child.app/Contents/Helpers/ParentalControlAgentUser" >/dev/null; then
                helper_ok=true
                break
              fi
              if [[ "$attempt" != 3 ]]; then sleep 2; fi
            done
            if [[ "$helper_ok" != true ]]; then
              status_exit=1
              /bin/launchctl print "gui/$(/usr/bin/id -u "$console_user")/com.bilalalissa.ParentalControlAgent.user" || true
              /usr/bin/log show --style compact --last 10m \
                --predicate 'process == "ParentalControlAgentUser"' || true
            fi
            test -x "/Applications/Parental Control Child.app/Contents/Helpers/ParentalControlBrowserHost"
            test -f "/Library/Google/Chrome/NativeMessagingHosts/com.bilalalissa.parental_control.json"
            test -f "/Library/Microsoft/Edge/NativeMessagingHosts/com.bilalalissa.parental_control.json"
            test -f "$console_user_home/Library/Application Support/Arc/User Data/NativeMessagingHosts/com.bilalalissa.parental_control.json"
          else
            status_exit=1
            sudo /bin/launchctl print system/com.bilalalissa.ParentalControlAgent.daemon || true
            sudo /bin/cat /var/log/com.bilalalissa.ParentalControlAgent.daemon.log || true
            sudo /bin/cat "/Library/Application Support/ParentalControlAgent/Logs/agent.log" || true
            sudo /bin/ls -la "/Library/Application Support/ParentalControlAgent" || true
            /usr/bin/codesign --verify --verbose=4 /usr/local/bin/parental-control-agentctl || true
            /usr/bin/codesign -dvvv /usr/local/bin/parental-control-agentctl || true
            sudo /usr/bin/log show --style compact --last 10m \
              --predicate 'process == "ParentalControlAgentDaemon"' || true
          fi
          /usr/bin/open -n "/Applications/Parental Control Child.app"
          app_started=false
          for attempt in 1 2 3; do
            if /usr/bin/pgrep -f "/Applications/Parental Control Child.app/Contents/MacOS/ParentalControlChild" >/dev/null; then
              app_started=true
              break
            fi
            if [[ "$attempt" != 3 ]]; then sleep 2; fi
          done
          if [[ "$app_started" != true ]]; then
            status_exit=1
          else
            sleep 5
            if ! /usr/bin/pgrep -f "/Applications/Parental Control Child.app/Contents/MacOS/ParentalControlChild" >/dev/null; then
              status_exit=1
              /bin/ls -lt "$HOME/Library/Logs/DiagnosticReports"/ParentalControlChild*.ips || true
            fi
          fi
          /usr/bin/pkill -f "/Applications/Parental Control Child.app/Contents/MacOS/ParentalControlChild" >/dev/null 2>&1 || true
          sudo "/Applications/Parental Control Child.app/Contents/Resources/uninstall.sh"
          test ! -e "/Applications/Parental Control Child.app"
          test ! -e /Library/LaunchDaemons/com.bilalalissa.ParentalControlAgent.daemon.plist
          test ! -e /Library/LaunchAgents/com.bilalalissa.ParentalControlAgent.user.plist
          test ! -e /Library/PrivilegedHelperTools/com.bilalalissa.ParentalControlAgent.daemon
          test ! -e /usr/local/bin/parental-control-agentctl
          test ! -e /Library/Google/Chrome/NativeMessagingHosts/com.bilalalissa.parental_control.json
          test ! -e /Library/Microsoft/Edge/NativeMessagingHosts/com.bilalalissa.parental_control.json
          test ! -e "$console_user_home/Library/Application Support/Arc/User Data/NativeMessagingHosts/com.bilalalissa.parental_control.json"
          exit "$status_exit"
      - name: Upload release candidate
        if: steps.scope.outputs.build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ParentalControlSystem-0.6.0-rc.2
          path: |
            .artifacts/release-candidate/ParentalControlSystem-0.6.0-rc.2.pkg
            .artifacts/release-candidate/ParentalControlSystem-0.6.0-rc.2.pkg.sha256
            .artifacts/release-candidate/ParentalControlBrowserSharing-0.6.0-rc.2.zip
            .artifacts/release-candidate/ParentalControlBrowserSharing-0.6.0-rc.2.zip.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Clean project-owned generated output
        if: always() && steps.scope.outputs.build == 'true'
        run: |
          if [[ -x "/Applications/Parental Control Child.app/Contents/Resources/uninstall.sh" ]]; then
            sudo "/Applications/Parental Control Child.app/Contents/Resources/uninstall.sh"
          fi
          sudo /bin/rm -rf -- "/Applications/Parental Control.app"
          sudo /usr/sbin/pkgutil --forget com.bilalalissa.ParentalControlController.component >/dev/null 2>&1 || true
          test "$PWD" = "$GITHUB_WORKSPACE"
          sudo /bin/rm -rf -- \
            "$PWD/dist" \
            "$PWD/.artifacts/derived-data" \
            "$PWD/.artifacts/package-staging"
          ./tools/cleanup.sh --apply
